[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pydartdiags"
version = "0.7.0"
authors = [
  { name="Helen Kershaw", email="hkershaw@ucar.edu" },
]
description = "Observation Sequence Diagnostics for DART"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "Apache-2.0"
dependencies = [
    "pandas>=2.2.0,<3.0.0",
    "numpy>=1.26",
    "plotly>=5.22.0",
    "pyyaml>=6.0.2",
    "matplotlib>=3.9.4"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "black",
]
docs = [
    "sphinx",
    "pydata_sphinx_theme",
    "sphinx-copybutton",
    "myst-parser",
    "sphinx-design",
    "sphinx-gallery",
]

[project.urls]
Homepage = "https://github.com/NCAR/pyDARTdiags.git"
Issues = "https://github.com/NCAR/pyDARTdiags/issues"
Documentation = "https://ncar.github.io/pyDARTdiags"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pydartdiags*"]
