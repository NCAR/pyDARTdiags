name: Run tests and upload coverage

on:
  push:
    branches:
      - main
      - code-cov
      - feature/*
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }}, pandas ${{ matrix.pandas }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
        pandas: ["pandas>=2.2,<3", "pandas>=3,<4"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install pytest pytest-cov "${{ matrix.pandas }}"

      - name: Install pydartdiags
        run: python -m pip install .

      - name: Show installed pandas version
        run: python -c "import pandas; print(pandas.__version__)"

      - name: Run tests
        run: pytest --cov=pydartdiags tests/

      - name: Upload results to Codecov
        if: matrix.python-version == '3.14' && matrix.pandas == 'pandas>=3,<4'
        uses: codecov/codecov-action@ad3126e916f78f00edff4ed0317cf185271ccc2d # v5.4.2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}